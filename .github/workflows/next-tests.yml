name: Next tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run storefront tests
        run: node --test scripts/tests/*.test.mjs scripts/tests/*.test.cjs
      - name: Check TypeScript
        run: npm exec -- tsc --noEmit
      - name: Check existing ESLint configuration against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline=$(mktemp -d)
          git worktree add --detach "$baseline" "$BASE_SHA"
          if cmp -s package-lock.json "$baseline/package-lock.json"; then
            ln -s "$PWD/node_modules" "$baseline/node_modules"
          else
            npm ci --prefix "$baseline" --no-audit --no-fund
          fi
          node scripts/ci/check-eslint-baseline.mjs "$baseline"
